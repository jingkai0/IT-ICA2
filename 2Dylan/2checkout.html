<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reshoe</title>
    <link rel="stylesheet" href="2checkout.css">
</head>

    <form onsubmit="event.preventDefault();">

        <div class="checkout-layout">
            
            <!-- Left Column -->
            <div class="main-content">

                <section>

                    <div class="checkout-header">

                     <a href="../1Ethan/1homepage.html" class="back-link">← Back to Home</a>

                    </div>

                    <h2>Delivery</h2>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input type="tel" id="phone" required>
                    </div>

                </section>

                <section>

                    <h2>Payment</h2>

                    <div class="form-group">

                        <label class="radio-label">
                            <input type="radio" name="payment-method" checked>
                            Credit
                            <input type="radio" name="payment-method" checked>
                             Debit
                        </label>

                    </div>

                    <div class="form-group">

                        <label for="card-name">Name on card</label>
                        <input type="text" id="card-name" required>

                    </div>

                    <div class="form-group">

                        <label for="card-number">Card number</label>
                        <input type="text" id="card-number" placeholder="0000 0000 0000 0000" required>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label for="card-expiry">MM/YY</label>
                            <input type="text" id="card-expiry" placeholder="MM/YY" required>

                        </div>

                        <div class="form-group">

                            <label for="card-cvc">Security code</label>
                            <input type="text" id="card-cvc" placeholder="CVC" required>

                        </div>

                        <button type="submit" class="btn-submit">

                            <a href="../5Jayden/5tqfororder.html">Place Order</a>
                            
                        </button>
                    </div>

                </section>

            </div>

            <!-- Right Column -->
            <div class="sidebar-container">

                <div class="order-summary-box">

                    <h3>Order Summary <span class="sticky-tag"></span></h3>
                    
                    <div class="product-list">

                        <div class="product-item">
                            <span>Product Item 1</span>
                            <span>$29.99</span>
                        </div>

                        <div class="product-item">
                            <span>Product Item 2</span>
                            <span>$49.99</span>
                        </div>

                    </div>

                    <div class="totals-row">
                        <span>Subtotal</span>
                        <span>$79.98</span>
                    </div>

                </div>

            </div>

        </div>

    </form>

    <footer>

    <div class="footer-container">

        <div class="footer-box">
            <h3><a href="../3Yuhao/3aboutus.html">About Us</a></h3>
            <p>Learn more about ReShoe and our mission.</p>
        </div>

        <div class="footer-box">
            <h3>ReShoe</h3>
            <p>&copy; 2026 ReShoe</p>
            <p>Affordable Sneakers for Everyone</p>
        </div>

        <div class="footer-box">
            <h3><a href="../4Junwei/4contactus.html">Contact Us</a></h3>
            <p>info@reshoe.com</p>
        </div>

    </div>

  </footer>

 </body>
 
</html>
