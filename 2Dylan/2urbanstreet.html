<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="2urbanstreet.css">
</head>
<body class="urbanstreet">

    <!-- Nav Section -->
     <header>

     <div class="top-bar">

        <a href="../1Ethan/1homepage.html">
            <img src="../Images/logo.png" alt="ReShoe Logo" class="logo">
        </a>

        <input type="text" placeholder="Search..." class="search-bar">

        <a href="2shoppingcart.html" class="cart-button">
            Shopping Cart
        </a>

      </div>

      <nav>

        <ul>

            <li><a href="../1Ethan/1newreleases.html">New Releases</a></li>

            <li><a href="../1Ethan/1trending.html">Trending</a></li>

            <li><a href="../3Yuhao/3brands.html">Brands</a></li>

            <li><a href="../4Junwei/4contactus.html">Contact Us</a></li>

            <li><a href="../3Yuhao/3aboutus.html">About Us</a></li>

        </ul>

       </nav>

     </header>
    

    <!-- Main Content Section -->
    <main class="main-container">
        <!-- Left Column -->
        <section class="left-column">
            <div class="product-picture">
                <span>Picture of product</span>
            </div>
            <div class="product-description">
                <p>— Description of product —</p>
            </div>
        </section>

        <!-- Right Column -->
        <section class="right-column">
            <h1 class="product-name">Name of product</h1>
            
            <div class="purchase-actions">
                <div class="price-box">Price</div>
                <button class="add-to-cart">Add to cart</button>
            </div>

            <div class="size-grid">
                <button class="size-btn">US 7</button>
                <button class="size-btn">US 7.5</button>
                <button class="size-btn">US 8</button>
                <button class="size-btn">US 8.5</button>
                <button class="size-btn">US 9</button>
                <button class="size-btn">US 9.5</button>
                <button class="size-btn">US 10</button>
                <button class="size-btn">US 10.5</button>
                <button class="size-btn">US 11</button>
            </div>
        </section>
    </main>

    <!-- ==========================
     FOOTER
=========================== -->

<footer>

    <div class="footer-container">

        <div class="footer-box">
            <h3><a href="../3Yuhao/3aboutus.html">About Us</a></h3>
            <p>Learn more about ReShoe and our mission.</p>
        </div>

        <div class="footer-box">
            <h3>ReShoe</h3>
            <p>&copy; 2026 ReShoe</p>
            <p>Affordable Sneakers for Everyone</p>
        </div>

        <div class="footer-box">
            <h3><a href="../4Junwei/4contactus.html">Contact Us</a></h3>
            <p>info@reshoe.com</p>
        </div>

    </div>

</footer>

</body>
</html>
